name: Sync LFG data

on:
  schedule:
    # Minimo do GitHub Actions: a cada 5 minutos
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lfg-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Sync Cartola -> JSON estatico
        run: node scripts/sync_lfg.js

      - name: Commit e push se placar/tabela mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/calendario_2026.json \
            client/public/data/calendario.json \
            client/public/data/classificacao.json \
            client/public/data/estatisticas.json \
            client/public/data/meta.json
          # Ignora commit se so meta.json mudou (evita spam de deploy na Vercel)
          OTHER=$(git diff --cached --name-only | grep -v 'meta\.json$' || true)
          if [ -z "$OTHER" ]; then
            git reset HEAD -- client/public/data/meta.json >/dev/null 2>&1 || true
            echo "Sem mudancas de placar/tabela."
          else
            git commit -m "chore: sync dados LFG $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
